<text x="74" y="112" font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="67" font-weight="830" text-anchor="start" fill="#ffffff" >vira</text><text x="74" y="238" font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="78" font-weight="820" text-anchor="start" fill="#ffffff" >Own how your</text><text x="74" y="336" font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="88" font-weight="820" text-anchor="start" fill="#18c1ff" >AI</text><text x="194" y="336" font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="88" font-weight="820" text-anchor="start" fill="#ff995c" >behaves</text><text x="76" y="399" font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="25" font-weight="600" text-anchor="start" fill="#eaf4ff" >Define it. Test it. Release it. Know what ran.</text><text x="76" y="470" font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="23" font-weight="480" text-anchor="start" fill="#bfcee0" >A governed behavior layer for existing AI</text><text x="76" y="504" font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="23" font-weight="480" text-anchor="start" fill="#bfcee0" >applications, agents and models.</text><rect x="76" y="558" width="184" height="34" rx="17" fill="#0b1b2b" stroke="#28c5fc" stroke-width="1.4" /><text x="168" y="581" font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#eaf4ff" >BEHAVIOR PACKS</text><rect x="273" y="558" width="165" height="34" rx="17" fill="#0b1b2b" stroke="#ff9b64" stroke-width="1.4" /><text x="355.5" y="581" font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#eaf4ff" >AUTO TASKRUN</text><rect x="733" y="76" width="638" height="169" rx="23" fill="url(#panel)" stroke="#287fbb" stroke-width="2" /><text x="757" y="112" font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="24" font-weight="750" text-anchor="start" fill="#f2f8ff" >Behavior Packs</text><text x="757" y="140" font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" font-weight="650" text-anchor="start" fill="#40cbff" >TASK • POINT • PROGRAM • STRATEGY</text><rect x="757" y="157" width="268" height="56" rx="12" fill="#0b2438" stroke="#3391c2" stroke-width="1.1" /><text x="781" y="192" font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="19" font-weight="630" text-anchor="start" fill="#f1f8ff" >support assistant</text><rect x="1040" y="157" width="305" height="56" rx="12" fill="#0b2438" stroke="#3391c2" stroke-width="1.1" /><text x="1060" y="192" font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="19" font-weight="630" text-anchor="start" fill="#f1f8ff" >retail-media review</text><rect x="768" y="270" width="602" height="303" rx="24" fill="url(#panel)" stroke="#ff9e5e" stroke-width="2" /><text x="792" y="306" font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="24" font-weight="750" text-anchor="start" fill="#f2f8ff" >AUTO TaskRun</text><text x="792" y="334" font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" font-weight="650" text-anchor="start" fill="#ffa96d" >CANONICAL EXECUTION PATH</text><rect x="1170" y="292" width="172" height="34" rx="17" fill="#0b1b2b" stroke="#ff9a58" stroke-width="1.4" /><text x="1256" y="315" font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#eaf4ff" >INTEGRATION</text><rect x="798" y="364" width="542" height="59" rx="12" fill="#071a2b" stroke="#347398" stroke-width="1.1" /><text x="824" y="401" font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="19" font-weight="600" text-anchor="start" fill="#e5f2ff" >Semantic task → eligible mode dispatch</text><rect x="798" y="433" width="542" height="58" rx="12" fill="#071a2b" stroke="#347398" stroke-width="1.1" /><text x="824" y="469" font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="18" font-weight="600" text-anchor="start" fill="#e5f2ff" >Released behavior → real child executor</text><rect x="798" y="504" width="542" height="46" rx="11" fill="#1e1b23" stroke="#b16f46" stroke-width="1.2" /><text x="824" y="533" font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="600" text-anchor="start" fill="#ffd3a9" >Provider + final output verification: integration dependent</text><rect x="731" y="599" width="640" height="92" rx="19" fill="#0c1926" stroke="#32718f" stroke-width="1.5" /><text x="758" y="636" font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="21" font-weight="680" text-anchor="start" fill="#ffffff" >Read actual outcomes. Don't invent verification.</text><text x="758" y="666" font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="460" text-anchor="start" fill="#bdcad9" >Concept illustration • Service access remains provisioned</text><text x="76" y="682" font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="18" font-weight="520" text-anchor="start" fill="#b6c6d7" >Public SDKs · 27 Agent Skills · Three graded Behavior Packs</text></svg>