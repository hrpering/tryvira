<path d="M0 605 Q 448 460 793.6 570 T1280 480" fill="none" stroke="#12bbfa" stroke-opacity=".25" stroke-width="3"/>
<path d="M0 632 Q 550.4 540 947.2 617 T1280 540" fill="none" stroke="#ff9758" stroke-opacity=".24" stroke-width="3"/>
<text x="78" y="145" font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="95" font-weight="850" text-anchor="start" fill="#ffffff" >vira</text><text x="78" y="280" font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="71" font-weight="810" text-anchor="start" fill="#ffffff" >Own how your</text><text x="78" y="364" font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="78" font-weight="810" text-anchor="start" fill="#ff995b" >AI behaves</text><text x="80" y="434" font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="30" font-weight="600" text-anchor="start" fill="#d6e4f2" >Define it. Test it. Release it.</text><text x="80" y="470" font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="30" font-weight="600" text-anchor="start" fill="#d6e4f2" >Know what ran.</text><rect x="80" y="530" width="202" height="34" rx="17" fill="#0b1b2b" stroke="#32bfff" stroke-width="1.4" /><text x="181" y="553" font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#eaf4ff" >BEHAVIOR PACKS</text><rect x="298" y="530" width="190" height="34" rx="17" fill="#0b1b2b" stroke="#ffa46d" stroke-width="1.4" /><text x="393" y="553" font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#eaf4ff" >AUTO TASKRUN</text><rect x="718" y="139" width="482" height="118" rx="19" fill="url(#panel)" stroke="#3298cd" stroke-width="1.8" /><text x="748" y="190" font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="28" font-weight="740" text-anchor="start" fill="#f7fcff" >Versioned behavior</text><text x="748" y="222" font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="19" font-weight="500" text-anchor="start" fill="#a8cde3" >Declare • Evaluate • Release</text><rect x="750" y="289" width="450" height="118" rx="19" fill="url(#panel)" stroke="#ffa26b" stroke-width="1.8" /><text x="780" y="340" font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="28" font-weight="740" text-anchor="start" fill="#fff" >Governed execution</text><text x="780" y="372" font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="18" font-weight="500" text-anchor="start" fill="#efd0b8" >AUTO routing • Released Programs</text><rect x="778" y="435" width="422" height="120" rx="19" fill="url(#panel)" stroke="#3298cd" stroke-width="1.8" /><text x="808" y="488" font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="27" font-weight="740" text-anchor="start" fill="#fff" >Evidence &amp; inspection</text><text x="808" y="520" font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="16" font-weight="500" text-anchor="start" fill="#b8cfe4" >Actual checks require real integration</text></svg>