<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img"><title>Vira: governed AI behavior</title><desc>Conceptual developer illustration, not a screenshot, benchmark or live verification receipt.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050912"/><stop offset=".54" stop-color="#071323"/><stop offset="1" stop-color="#101119"/></linearGradient>
<radialGradient id="blue"><stop offset="0" stop-color="#005ec3" stop-opacity=".50"/><stop offset="1" stop-color="#005ec3" stop-opacity="0"/></radialGradient>
<radialGradient id="orange"><stop offset="0" stop-color="#ff813d" stop-opacity=".36"/><stop offset="1" stop-color="#ff813d" stop-opacity="0"/></radialGradient>
<linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#12293f"/><stop offset="1" stop-color="#091521"/></linearGradient>
<linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#02bcff"/><stop offset="1" stop-color="#ff9a58"/></linearGradient>
<filter id="glow"><feGaussianBlur stdDeviation="23"/></filter>
<pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0 H0 V42" fill="none" stroke="#245171" stroke-opacity=".18" stroke-width="1"/></pattern>
</defs>
<rect width="1280" height="640" fill="url(#bg)"/>
