</g>
<g font-family="Inter,Segoe UI,Arial,sans-serif">
<rect x="100" y="215" width="92" height="28" rx="14" fill="#EEF2FF"/><text x="146" y="234" text-anchor="middle" font-size="13" font-weight="800" fill="#4F46E5">MARKETING</text>
<text x="100" y="280" font-size="23" font-weight="750" fill="#0F172A">Launch planning</text><text x="100" y="312" font-size="15" fill="#64748B">full-funnel coverage · measurement · approval</text>
<rect x="660" y="215" width="82" height="28" rx="14" fill="#ECFEFF"/><text x="701" y="234" text-anchor="middle" font-size="13" font-weight="800" fill="#0891B2">SUPPORT</text>
<text x="660" y="280" font-size="23" font-weight="750" fill="#0F172A">Customer response agents</text><text x="660" y="312" font-size="15" fill="#64748B">escalation · response checks · traceability</text>
<rect x="100" y="420" width="90" height="28" rx="14" fill="#F5F3FF"/><text x="145" y="439" text-anchor="middle" font-size="13" font-weight="800" fill="#7C3AED">RESEARCH</text>
<text x="100" y="485" font-size="23" font-weight="750" fill="#0F172A">Research & synthesis</text><text x="100" y="517" font-size="15" fill="#64748B">source discipline · review checkpoints · structure</text>
<rect x="660" y="420" width="108" height="28" rx="14" fill="#ECFDF5"/><text x="714" y="439" text-anchor="middle" font-size="13" font-weight="800" fill="#059669">OPERATIONS</text>
<text x="660" y="485" font-size="23" font-weight="750" fill="#0F172A">Tool-using assistants</text><text x="660" y="517" font-size="15" fill="#64748B">task routing · action controls · released behavior</text>
