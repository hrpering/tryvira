<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">Vira use cases</title><desc id="desc">Example use cases across marketing, support, research and operations.</desc>
<defs><filter id="s"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-opacity="0.08"/></filter></defs>
<rect width="1200" height="620" rx="28" fill="#FCFCFF"/>
<text x="70" y="72" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#4F46E5">USE CASES</text>
<text x="70" y="116" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="750" fill="#0F172A">The same control loop, different kinds of AI work</text>
<g filter="url(#s)">
<rect x="70" y="185" width="500" height="165" rx="24" fill="#FFFFFF" stroke="#E2E8F0"/>
<rect x="630" y="185" width="500" height="165" rx="24" fill="#FFFFFF" stroke="#E2E8F0"/>
