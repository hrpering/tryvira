<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Vira GPU acceleration vision</title>
  <desc id="desc">A conceptual architecture showing request routing, released behavior, a shared accelerator runtime, model inference, verification, and trace.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#F6F3EA"/>
    </linearGradient>
    <linearGradient id="gpu" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F766E"/>
      <stop offset="1" stop-color="#155E75"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#64748B"/>
    </marker>
  </defs>

  <rect width="1400" height="760" rx="36" fill="url(#bg)"/>

  <text x="70" y="76" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#0F766E">VIRA · ACCELERATOR VISION</text>
  <text x="70" y="126" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="40" font-weight="760" fill="#0F172A">Move governed behavior closer to model inference</text>
  <text x="70" y="164" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" fill="#475569">Experimental architecture. CPU remains first-class. Production promotion requires parity and operational acceptance.</text>

  <g filter="url(#shadow)">
    <rect x="70" y="250" width="190" height="120" rx="22" fill="#FFFFFF"/>
    <rect x="300" y="250" width="210" height="120" rx="22" fill="#FFFFFF"/>
    <rect x="550" y="230" width="530" height="300" rx="30" fill="#FFFFFF"/>
    <rect x="1120" y="250" width="210" height="120" rx="22" fill="#FFFFFF"/>
    <rect x="1120" y="420" width="210" height="120" rx="22" fill="#FFFFFF"/>
  </g>

  <text x="105" y="292" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#64748B">1 · REQUEST</text>
  <text x="105" y="326" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="750" fill="#0F172A">User / Agent</text>
  <text x="105" y="352" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#64748B">task + context</text>

  <text x="335" y="292" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#64748B">2 · GOVERNED INPUT</text>
  <text x="335" y="326" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="750" fill="#0F172A">Semantic + Behavior</text>
  <text x="335" y="352" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#64748B">released + scoped</text>

  <rect x="590" y="270" width="450" height="220" rx="26" fill="url(#gpu)"/>
  <text x="625" y="310" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#CCFBF1">3 · SHARED ACCELERATOR PATH</text>
  <text x="625" y="350" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="760" fill="#FFFFFF">Same-device execution</text>

  <rect x="625" y="382" width="175" height="76" rx="18" fill="#FFFFFF" fill-opacity="0.12" stroke="#FFFFFF" stroke-opacity="0.25"/>
  <text x="645" y="413" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Behavior runtime</text>
  <text x="645" y="438" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#D6F4F1">plan · constraints · verify</text>

  <rect x="830" y="382" width="175" height="76" rx="18" fill="#FFFFFF" fill-opacity="0.12" stroke="#FFFFFF" stroke-opacity="0.25"/>
  <text x="850" y="413" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Model runtime</text>
  <text x="850" y="438" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#D6F4F1">prefill · decode · output</text>

  <text x="1155" y="292" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#64748B">4 · RESULT</text>
  <text x="1155" y="326" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="750" fill="#0F172A">Final output</text>
  <text x="1155" y="352" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#64748B">model-owned prose</text>

  <text x="1155" y="462" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#64748B">5 · EVIDENCE</text>
  <text x="1155" y="496" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="750" fill="#0F172A">Trace / receipt</text>
  <text x="1155" y="522" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#64748B">what applied + why</text>

  <path d="M260 310 L292 310" stroke="#64748B" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M510 310 L575 310" stroke="#64748B" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1040 310 L1110 310" stroke="#64748B" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1225 370 L1225 410" stroke="#64748B" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1120 480 C1015 600 765 625 610 545" fill="none" stroke="#94A3B8" stroke-width="2.5" stroke-dasharray="8 8" marker-end="url(#arrow)"/>

  <g>
    <rect x="70" y="610" width="1260" height="90" rx="22" fill="#FFFFFF" stroke="#E2E8F0"/>
    <circle cx="110" cy="655" r="10" fill="#0F766E"/>
    <text x="135" y="648" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#0F172A">Promotion principle</text>
    <text x="135" y="674" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#64748B">OFF → SHADOW → CANARY → LIMITED → GENERAL, with CPU parity, explicit fallback, and release identity preserved.</text>
  </g>
</svg>