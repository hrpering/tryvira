<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="745" viewBox="0 0 1440 745" role="img"><title>Vira: governed AI behavior</title><desc>Conceptual developer illustration, not a screenshot, benchmark or live verification receipt.</desc>
