<text x="65" y="97" font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="58" font-weight="820" text-anchor="start" fill="#ffffff" >vira</text><text x="250" y="98" font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="48" font-weight="790" text-anchor="start" fill="#ffffff" >Same request. Different boundaries.</text><text x="65" y="147" font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="22" font-weight="500" text-anchor="start" fill="#bacbdd" >The public OFF/ON example shows actual model output on OFF and TaskRun status on ON.</text><rect x="60" y="202" width="641" height="395" rx="23" fill="url(#panel)" stroke="#2dbbfa" stroke-width="2" /><rect x="736" y="202" width="643" height="395" rx="23" fill="url(#panel)" stroke="#ff9559" stroke-width="2" /><text x="89" y="260" font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="35" font-weight="780" text-anchor="start" fill="#f9fcff" >Vira OFF</text><rect x="510" y="229" width="158" height="34" rx="17" fill="#0b1b2b" stroke="#2dbbfa" stroke-width="1.4" /><text x="589" y="252" font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#eaf4ff" >MODEL CALL</text><text x="765" y="260" font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="35" font-weight="780" text-anchor="start" fill="#f9fcff" >Vira ON</text><rect x="1170" y="229" width="172" height="34" rx="17" fill="#0b1b2b" stroke="#ff9c5d" stroke-width="1.4" /><text x="1256" y="252" font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#eaf4ff" >TASKRUN</text><rect x="92" y="292" width="570" height="76" rx="11" fill="#0a1f30" stroke="#3c728f" stroke-width="1" /><text x="111" y="326" font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="17" font-weight="710" text-anchor="start" fill="#78d6fa" >User request</text><text x="111" y="355" font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="18" font-weight="500" text-anchor="start" fill="#e8f1fa" >Summarize the uploaded customer issue.</text><rect x="765" y="292" width="574" height="76" rx="11" fill="#0a1f30" stroke="#a97450" stroke-width="1" /><text x="786" y="326" font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="17" font-weight="710" text-anchor="start" fill="#fbb17a" >Same request</text><text x="786" y="355" font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="18" font-weight="500" text-anchor="start" fill="#e8f1fa" >Summarize the uploaded customer issue.</text><rect x="92" y="396" width="570" height="144" rx="13" fill="#0b283b" stroke="#2a83af" stroke-width="1" /><text x="114" y="432" font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="24" font-weight="760" text-anchor="start" fill="#f7fcff" >Provider response</text><text x="114" y="464" font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="18" font-weight="500" text-anchor="start" fill="#c8ddec" >The model generates a baseline answer</text><text x="114" y="490" font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="18" font-weight="500" text-anchor="start" fill="#c8ddec" >using your configured provider key.</text><rect x="765" y="396" width="574" height="144" rx="13" fill="#26202b" stroke="#aa724e" stroke-width="1" /><text x="785" y="432" font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="24" font-weight="760" text-anchor="start" fill="#fff" >AUTO TaskRun admission / state</text><text x="786" y="465" font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="19" font-weight="660" text-anchor="start" fill="#ffbb8b" >Pending verified chatbot response</text><text x="786" y="494" font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="17" font-weight="490" text-anchor="start" fill="#d6c8c5" >No ON provider answer is fabricated.</text><rect x="60" y="624" width="1319" height="67" rx="18" fill="#0d1c2a" stroke="#367e9d" stroke-width="1.5" /><text x="85" y="650" font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="18" font-weight="770" text-anchor="start" fill="#7edcff" >Current integration status</text><text x="85" y="679" font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="20" font-weight="540" text-anchor="start" fill="#e5edf6" >ON completion and final post-model output receipt still require end-to-end integration.</text></svg>