name: Propose published Vira client updates
on:
  schedule:
    - cron: "17 0 1 * *"
  workflow_dispatch:
  # Re-evaluate the release sync when the maintainer explicitly updates this
  # workflow on main. Ordinary commits and generated PRs do not retrigger it.
  push:
    branches:
      - main
    paths:
      - .github/workflows/sync-published-packages.yml
      - scripts/mcp-catalog.mjs
      - scripts/sync-published-packages.mjs
      - scripts/sync-public-client-copy.mjs
      - scripts/sync-example-manifests.mjs
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: sync-published-package-references
  cancel-in-progress: false
jobs:
  sync:
    if: github.repository == 'hrpering/tryvira'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.3.2
      - name: Read npm/PyPI and published MCP catalog
        run: |
          npm run sync:registry
          node scripts/sync-example-manifests.mjs
          node scripts/sync-public-client-copy.mjs
      - name: Regenerate exact npm integrity locks and Python hash locks
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --prefix examples/frameworks/node-next
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --prefix tutorials/marketing-agent
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --prefix examples/frameworks/mcp-client
          uv pip compile --python-version 3.12 --generate-hashes examples/frameworks/python_fastapi/requirements.txt -o examples/frameworks/python_fastapi/requirements.lock
          uv pip compile --python-version 3.12 --generate-hashes examples/frameworks/langgraph/requirements.txt -o examples/frameworks/langgraph/requirements.lock
      - name: Check offline contracts and live registries
        run: |
          npm ci
          npm run verify
          npm run verify:registry
          npm run verify:mcp-registry-catalog
      - name: Create reviewable update PR; never push directly to main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add package-versions.json README.md README.tr.md docs examples tutorials
          if git diff --cached --quiet; then
            echo "Published package references already match the registries."
            exit 0
          fi
          BRANCH="chore/published-vira-clients-$(date -u +%Y%m%d)-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git commit -m "build: align published Vira clients, examples and MCP catalog"
          git push --set-upstream origin "$BRANCH"
          if gh pr create --base main --head "$BRANCH" \
            --title "build: update published Vira SDK/PyPI/MCP and examples" \
            --body "Registry-verified clients and MCP tool snapshot with regenerated npm/Python locks. Review the full CI before merging."; then
            echo "Registry sync PR created successfully."
          else
            echo "::warning::GitHub Actions cannot create PRs in this repository. The verified changes were pushed to $BRANCH."
            echo "Open a PR with the authenticated maintainer account:"
            echo "https://github.com/hrpering/tryvira/compare/main...$BRANCH?expand=1"
          fi
