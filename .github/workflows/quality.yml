name: Repository quality, including Agent Skills

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Use Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install repository dependencies
        run: npm ci

      - name: Verify public repository
        run: npm run verify

      - name: Package and independently verify all 27 Agent Skills
        run: |
          npm run package:skills -- --out /tmp/tryvira-skill-packages
          python3 scripts/verify_portable_skills.py /tmp/tryvira-skill-packages --expected 27
          python3 scripts/smoke_install_skills.py /tmp/tryvira-skill-packages --expected 27

      - name: Verify framework examples (JavaScript)
        run: |
          npm ci --prefix examples/frameworks/node-next
          npm test --prefix examples/frameworks/node-next
          npm run build --prefix examples/frameworks/node-next
          node --check skills/vira-evaluate/examples/run-pack-evaluation.mjs
          node --check skills/vira-evaluate/examples/pack-evaluation.mjs
          node --check skills/vira-observe-teach/examples/run-teach-analysis.mjs
          node --check skills/vira-observe-teach/examples/teach-analysis.mjs
          npm ci --prefix examples/frameworks/mcp-client
          node --check examples/frameworks/mcp-client/client.mjs
          npm ci --prefix tutorials/marketing-agent
          node --check tutorials/marketing-agent/06-runtime-resolve.mjs
          node --check tutorials/marketing-agent/07-quality-decision.mjs

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2

      - name: Verify framework examples (Python)
        run: |
          uv venv --python 3.12 examples/frameworks/python_fastapi/.venv
          uv pip sync --python examples/frameworks/python_fastapi/.venv/bin/python examples/frameworks/python_fastapi/requirements.lock
          examples/frameworks/python_fastapi/.venv/bin/python -m compileall -q examples/frameworks/python_fastapi
          examples/frameworks/python_fastapi/.venv/bin/python scripts/check-published-python-sdk.py
          uv venv --python 3.12 examples/frameworks/langgraph/.venv
          uv pip sync --python examples/frameworks/langgraph/.venv/bin/python examples/frameworks/langgraph/requirements.lock
          examples/frameworks/langgraph/.venv/bin/python -m compileall -q examples/frameworks/langgraph

      - name: Verify documented public package releases
        run: npm run verify:registry
