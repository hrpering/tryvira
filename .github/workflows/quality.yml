name: Repository quality, including Agent Skills

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Use Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install repository dependencies
        run: npm ci

      - name: Verify public repository
        run: npm run verify

      - name: Verify one-root-Skill discovery with the public Skills CLI
        run: |
          npx -y skills@1.7.4 add . --list > /tmp/vira-skills-list.txt
          cat /tmp/vira-skills-list.txt
          grep -E '\\bvira\\b' /tmp/vira-skills-list.txt
          if grep -E 'vira-(mcp|operator|full-lifecycle)' /tmp/vira-skills-list.txt; then
            echo "ROOT_DISCOVERY_SHOULD_NOT_EXPOSE_28_SPECIALISTS"
            exit 1
          fi

      - name: Probe separately distributed OpenCode plugin (informational)
        run: |
          if npm view @tryvira/opencode version --json --fetch-retries=1 --fetch-timeout=15000; then
            echo "OpenCode npm release found. Plugin source is not included in public repo."
          else
            echo "OpenCode plugin npm publication not established; the public repo offers integration guidance only."
          fi

      - name: Package and independently verify all 28 Agent Skills
        run: |
          npm run package:skills -- --out /tmp/tryvira-skill-packages
          python3 scripts/verify_portable_skills.py /tmp/tryvira-skill-packages --expected 28
          python3 scripts/smoke_install_skills.py /tmp/tryvira-skill-packages --expected 28

      - name: Publish verified 28-Skill archive bundle
        uses: actions/upload-artifact@v4
        with:
          name: vira-agent-skills-28
          path: /tmp/tryvira-skill-packages/*.skill
          if-no-files-found: error
          retention-days: 30

      - name: Verify current JavaScript SDK Observe example
        run: |
          npm install --prefix examples/javascript --ignore-scripts --no-audit --no-fund
          npm test --prefix examples/javascript

      - name: Verify framework examples (JavaScript)
        run: |
          npm ci --prefix examples/frameworks/node-next
          npm test --prefix examples/frameworks/node-next
          npm run build --prefix examples/frameworks/node-next
          node --check skills/vira-evaluate/examples/run-pack-evaluation.mjs
          node --check skills/vira-evaluate/examples/pack-evaluation.mjs
          node --check skills/vira-observe-teach/examples/run-teach-analysis.mjs
          node --check skills/vira-observe-teach/examples/teach-analysis.mjs
          npm ci --prefix examples/frameworks/mcp-client
          node --check examples/frameworks/mcp-client/client.mjs
          npm ci --prefix tutorials/marketing-agent
          node --check tutorials/marketing-agent/06-runtime-resolve.mjs
          node --check tutorials/marketing-agent/07-quality-decision.mjs

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2

      - name: Verify framework examples (Python)
        run: |
          uv venv --python 3.12 examples/frameworks/python_fastapi/.venv
          uv pip sync --python examples/frameworks/python_fastapi/.venv/bin/python examples/frameworks/python_fastapi/requirements.lock
          examples/frameworks/python_fastapi/.venv/bin/python -m compileall -q examples/frameworks/python_fastapi
          examples/frameworks/python_fastapi/.venv/bin/python scripts/check-published-python-sdk.py
          uv venv --python 3.12 examples/frameworks/langgraph/.venv
          uv pip sync --python examples/frameworks/langgraph/.venv/bin/python examples/frameworks/langgraph/requirements.lock
          examples/frameworks/langgraph/.venv/bin/python -m compileall -q examples/frameworks/langgraph

      - name: Verify current Python SDK Observe example
        run: |
          uv venv --python 3.12 examples/python/.venv
          uv pip install --python examples/python/.venv/bin/python 'tryvira-sdk==0.1.54'
          examples/python/.venv/bin/python -m unittest discover -s examples/python -p 'test_*.py' -v

      - name: Verify current public SDK, PyPI, MCP copy references
        run: node scripts/sync-public-client-copy.mjs --check

      - name: Verify published SDK/PyPI releases and exact MCP npm tool list
        run: |
          npm run verify:registry
          npm run verify:mcp-registry-catalog
