id: vira.marketing.starter
name: Marketing Starter
version: 1.1.0
requires:
  vira: ">=1.0"
variables:
  - key: brand_name
    label: Brand name
    required: true
  - key: markets
    label: Markets
    type: multi_select
  - key: approval_required
    label: Require approval before media changes?
    type: boolean
    default: true
